<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe14d">
<title>Arty Farty</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=DM+Sans:wght@400;500;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: poster-style single column that opens to image-left / lesson-right on wide screens.
   Flat colour blocks from the logo (aqua, blonde, rose, leaf green), thick ink borders, hard offset shadows. */
:root {
  --bg: #ffe14d;
  --paper: #fff6fb;
  --ink: #14120f;
  --on-ink: #fff6fb;
  --rose: #ff2e93;
  --muted: #4a3f1c;
  --b1: #4dddff;
  --b2: #ff8ad0;
  --b3: #c6ff4d;
  --on-block: #14120f;
  --display: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2a1065; --paper: #3a1a8a; --ink: #fff6fb; --on-ink: #2a1065;
    --rose: #ff6bb5; --muted: #d3c2ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2a1065; --paper: #3a1a8a; --ink: #fff6fb; --on-ink: #2a1065;
  --rose: #ff6bb5; --muted: #d3c2ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 24px 56px; }
.wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

header { display: flex; flex-direction: column; gap: 10px; }
h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(3rem, 14vw, 7rem); line-height: .85; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
h1 span { color: var(--rose); display: inline-block; transform: rotate(-4deg); text-shadow: 3px 3px 0 var(--ink); }
.tile:nth-child(odd) { transform: rotate(-1deg); }
.tile:nth-child(even) { transform: rotate(1deg); }
.tag { font-family: var(--mono); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: .8rem; color: var(--muted); }

nav { display: flex; gap: 12px; flex-wrap: wrap; }
.tab { background: var(--paper); border: 3px solid var(--ink); padding: 10px 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .9rem; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
.tab:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }

.btn { background: var(--ink); color: var(--on-ink); border: 3px solid var(--ink); padding: 12px 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .88rem; cursor: pointer; box-shadow: 4px 4px 0 var(--rose); }
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--rose); }
.btn.alt { background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.btn.alt:active { box-shadow: 2px 2px 0 var(--ink); }
.btn[disabled], .btn.busy { opacity: .45; cursor: not-allowed; box-shadow: none; pointer-events: none; }
label.btn { display: inline-block; text-align: center; position: relative; }
label.btn:focus-within { outline: 3px solid var(--rose); outline-offset: 3px; }
.pick { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

.card { background: var(--paper); border: 3px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); }
.drop { border-style: dashed; box-shadow: none; padding: 22px 18px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; }
.drop.over { background: var(--b1); color: var(--on-block); }
.drop h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: .95; margin: 0 0 6px; }
.drop p { margin: 0; max-width: 34ch; color: var(--muted); }
.drop.over p { color: var(--on-block); }
.drop-text { min-width: 0; }
.btns { display: flex; gap: 14px; flex-wrap: wrap; }
.hint { font-family: var(--mono); font-size: .85rem; color: var(--muted); }

.lesson { display: grid; gap: 22px; padding: 18px; }
.lesson > * { min-width: 0; }
@media (min-width: 780px) { .lesson { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); padding: 24px; gap: 28px; } .lesson .assign { grid-column: 1 / -1; } }
.shot { margin: 0; border: 3px solid var(--ink); background: var(--bg); position: relative; align-self: start; }
.shot img { display: block; width: 100%; max-height: 520px; object-fit: contain; }
.shot .ph { min-height: 260px; display: grid; place-items: center; padding: 20px; text-align: center; font-family: var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.stamp { position: absolute; top: 10px; left: 10px; background: #14120f; color: #c6ff4d; transform: rotate(-3deg); font-family: var(--mono); font-weight: 700; letter-spacing: .16em; font-size: .75rem; padding: 4px 10px; border: 2px solid var(--ink); }
.info { display: flex; flex-direction: column; gap: 16px; }
.info h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(1.9rem, 6vw, 3rem); line-height: .95; letter-spacing: -.01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.meta { font-family: var(--mono); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.flag { background: var(--b1); color: var(--on-block); padding: 2px 8px; border: 2px solid var(--ink); font-size: .75rem; }
.note { margin: 0; color: var(--muted); font-style: italic; }
.facts { display: grid; gap: 14px; }
.fact { border: 3px solid var(--ink); padding: 14px 16px 16px; color: var(--on-block); display: flex; flex-direction: column; gap: 8px; }
.fact:nth-child(1) { background: var(--b1); }
.fact:nth-child(2) { background: var(--b2); }
.fact:nth-child(3) { background: var(--b3); }
.fact .k { align-self: flex-start; background: #14120f; color: #fff8e6; font-family: var(--mono); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: .75rem; padding: 3px 10px; }
.fact p { margin: 0; font-weight: 500; }

.assign { border: 3px solid var(--ink); background: var(--bg); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.assign h3 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 1.5rem; line-height: 1; margin: 0; }
.assign .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.task h4 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
.chips li { background: var(--paper); border: 2px solid var(--ink); padding: 2px 10px; font-family: var(--mono); font-weight: 700; font-size: .85rem; }
.task ol { margin: 0 0 12px; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.task .twist { margin: 0; padding: 10px 14px; background: var(--b2); color: var(--on-block); font-weight: 700; border: 2px solid var(--ink); }

.status { padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.status .shot { max-width: 320px; }
.status p { margin: 0; font-family: var(--mono); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.result { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.result h4 { font-family: var(--display); font-weight: 800; font-size: 1.4rem; margin: 0; }
.result .shot { max-width: 360px; }
.status .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.bar { height: 10px; border: 2px solid var(--ink); background: var(--paper); overflow: hidden; position: relative; }
.bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--rose); animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { to { left: 65%; } }
@media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
.err { padding: 18px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.err p { margin: 0; font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 20px; }
.tile { text-align: left; padding: 0; cursor: pointer; background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); display: flex; flex-direction: column; min-width: 0; }
.tile:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--ink); }
.tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-bottom: 3px solid var(--ink); }
.tile .tb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile strong { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.1; overflow-wrap: anywhere; }
.tile small { font-family: var(--mono); color: var(--muted); font-size: .8rem; }
.tile .has { font-family: var(--mono); font-weight: 700; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; background: var(--b1); color: var(--on-block); align-self: flex-start; padding: 1px 8px; border: 2px solid var(--ink); }
.empty { padding: 28px 20px; }
.empty h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 1.8rem; margin: 0 0 6px; }
.empty p { margin: 0 0 14px; color: var(--muted); }
.bar-top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 20px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 18px; font-family: var(--mono); font-weight: 700; font-size: .85rem; border: 3px solid var(--rose); max-width: calc(100vw - 32px); z-index: 5; }
footer { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
</style>

<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.codein{border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 14px;min-width:0;flex:1 1 180px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Arty <span>Farty</span></h1>
    <div class="tag">Snap it. Decode it. Remix it.</div>
  </header>

  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-scan" aria-selected="true" aria-controls="view-scan">Decode</button>
    <button class="tab" role="tab" id="tab-archive" aria-selected="false" aria-controls="view-archive">My stash (0)</button>
  </nav>

  <main>
    <section id="view-scan" role="tabpanel" aria-labelledby="tab-scan" style="display:flex;flex-direction:column;gap:24px">
      <div class="card drop" id="drop">
        <div class="drop-text">
          <h2>Found some art? Decode it.</h2>
          <p>Snap a pic or upload one. You get who made it, when, and three things that make it actually interesting.</p>
        </div>
        <div class="btns">
          <label class="btn" id="btn-cam">Take a pic<input class="pick" type="file" id="in-cam" accept="image/*" capture="environment"></label>
          <label class="btn alt" id="btn-up">Upload a pic<input class="pick" type="file" id="in-up" accept="image/*"></label>
        </div>
      </div>
      <div id="lesson-host"></div>
    </section>

    <section id="view-archive" role="tabpanel" aria-labelledby="tab-archive" hidden>
      <div id="archive-host"></div>
    </section>
  </main>

  <footer>Your stash lives in this browser on this device. Every lesson keeps its pic and its dare.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";
  var LS_KEY = "artyfarty.archive.v1", CODE_KEY = "artyfarty.code";
  var archive = [];
  var busy = false, lastFile = null, openId = null;

  function $(s) { return document.querySelector(s); }
  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (kid) {
        if (kid == null || kid === false) return;
        e.append(kid.nodeType ? kid : document.createTextNode(kid));
      });
    }
    return e;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  var EXAMPLE = {
    title: "The Starry Night", artist: "Vincent van Gogh", period: "Post-Impressionism", year: "1889",
    confidence: "high", note: "",
    facts: [
      { type: "Colour", text: "Deep blues clash with hot yellows. The opposites make the whole sky buzz." },
      { type: "Technique", text: "He piled the paint on thick (that's called impasto) and painted the night sky from memory, in daylight, based on the view from his asylum window." },
      { type: "Quote", text: "\"I know nothing with certainty, but the sight of the stars makes me dream.\" Van Gogh wrote that in a letter to his brother Theo." }
    ],
    image: null, assignment: null
  };

  /* ---------- storage: this browser ---------- */
  function load() { try { archive = JSON.parse(lsGet(LS_KEY) || "[]"); } catch (e) { archive = []; } }
  function persist() { if (!lsSet(LS_KEY, JSON.stringify(archive))) toast("Browser storage is full or blocked."); }
  function sorted() { return archive.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }); }
  function saveEntry(entry) {
    var e = Object.assign({}, entry, { id: "a" + Date.now(), createdAt: Date.now(), assignment: null });
    archive.push(e); persist(); return e;
  }
  function saveAssignment(entry, a) { entry.assignment = a; persist(); }
  function deleteEntry(entry) {
    archive = archive.filter(function (d) { return d.id !== entry.id; });
    persist(); openId = null; renderArchive(); toast("Gone.");
  }

  /* ---------- server calls ---------- */
  var CODE_KEY = "artyfarty.code";
  async function ai(path, body) {
    var headers = { "content-type": "application/json" };
    var code = lsGet(CODE_KEY);
    if (code) headers["x-access-code"] = code;
    var res;
    try { res = await fetch(path, { method: "POST", headers: headers, body: JSON.stringify(body) }); }
    catch (e) { throw { code: "network" }; }
    var data = null;
    try { data = await res.json(); } catch (e) { /* ignore */ }
    if (!res.ok) throw { code: res.status === 401 ? "unauthorized" : res.status === 429 ? (data && data.daily ? "daily_limit" : "rate_limited") : res.status === 500 ? "config" : "server", detail: (data && data.detail) || ("HTTP " + res.status) };
    return data;
  }
  function errCopy(e) {
    var c = e && e.code;
    if (c === "unauthorized") return "Enter the access code to get in.";
    if (c === "config") return "The server is not set up yet. Check the setup steps.";
    if (c === "network") return "No signal. Check your internet and try again.";
    if (c === "daily_limit") return "Today's free scans are used up. Come back tomorrow, it resets in the morning.";
    if (c === "rate_limited") return "Too many scans right now. Give it a minute, then try again.";
    if (c === "image_rejected") return "Couldn't use that pic. Try another one.";
    if (c === "invalid") return "Couldn't read that one. Try a clearer pic.";
    return "Something broke. Try again.";
  }
  function normalise(r, image) {
    var facts = (Array.isArray(r && r.facts) ? r.facts : []).slice(0, 3).map(function (f) {
      return { type: String((f && f.type) || "Fact"), text: String((f && f.text) || "") };
    }).filter(function (f) { return f.text; });
    if (!facts.length) throw { code: "invalid" };
    var conf = String(r.confidence || "low").toLowerCase();
    if (["high", "medium", "low"].indexOf(conf) < 0) conf = "low";
    return {
      title: String(r.title || "Untitled"), artist: String(r.artist || "Unknown"),
      period: String(r.period || ""), year: String(r.year || ""), confidence: conf,
      note: String(r.note || ""), facts: facts, image: image, assignment: null
    };
  }
  async function makeAssignment(entry, prevTitle) {
    var r = await ai("/api/challenge", { title: entry.title, artist: entry.artist, period: entry.period, facts: entry.facts, prev: prevTitle || "" });
    var steps = (Array.isArray(r && r.steps) ? r.steps : []).map(String).filter(Boolean);
    if (!steps.length) throw { code: "invalid" };
    return {
      title: String(r.title || "15-minute dare"),
      materials: (Array.isArray(r.materials) ? r.materials : []).map(String).filter(Boolean),
      steps: steps, twist: String(r.twist || "")
    };
  }

  /* ---------- images ---------- */
  async function scaled(file, max, q) {
    var url = URL.createObjectURL(file);
    try {
      var img = new Image(); img.src = url; await img.decode();
      var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", q);
    } finally { URL.revokeObjectURL(url); }
  }

  /* ---------- lesson view ---------- */
  function lessonView(entry, opts) {
    opts = opts || {};
    var shot = h("figure", { class: "shot" },
      entry.image ? h("img", { src: entry.image, alt: "Photo of " + entry.title }) : h("div", { class: "ph", text: "Your pic lands here" }),
      opts.example ? h("span", { class: "stamp", text: "EXAMPLE" }) : null);
    var meta = [entry.artist];
    if (entry.period) meta.push(entry.period);
    if (entry.year) meta.push(entry.year);
    var flag = entry.confidence === "low" ? "Best guess" : entry.confidence === "medium" ? "Pretty sure" : "";
    var info = h("div", { class: "info" },
      h("h2", { text: entry.title }),
      h("div", { class: "meta" }, h("span", { text: meta.join(" · ") }), flag ? h("span", { class: "flag", text: flag }) : null),
      entry.note ? h("p", { class: "note", text: entry.note }) : null,
      h("div", { class: "facts" }, entry.facts.map(function (f) {
        return h("div", { class: "fact" }, h("span", { class: "k", text: f.type }), h("p", { text: f.text }));
      })));
    function resultBox() {
      var wrap = h("div", { class: "result" });
      function draw() {
        wrap.replaceChildren();
        if (entry.resultImage) {
          wrap.append(
            h("h4", { text: "Your result" }),
            h("figure", { class: "shot" }, h("img", { src: entry.resultImage, alt: "Your result" })),
            h("div", { class: "row" }, h("button", { class: "btn alt", type: "button", text: "Remove pic", onclick: function () {
              entry.resultImage = null; persist(); draw();
            } })));
        } else {
          wrap.append(
            h("p", { class: "hint", text: "Did the dare? Add a pic of what you made. Totally optional." }),
            h("label", { class: "btn alt" }, "Add result pic",
              h("input", { class: "pick", type: "file", accept: "image/*", "aria-label": "Add result pic", onchange: async function (ev) {
                var f = ev.target.files && ev.target.files[0];
                ev.target.value = "";
                if (!f) return;
                try { entry.resultImage = await scaled(f, 800, 0.75); persist(); draw(); toast("Result saved."); }
                catch (e) { toast("Couldn't use that pic. Try another one."); }
              } })));
        }
      }
      draw();
      return wrap;
    }
    var box = h("div", { class: "assign" });
    function paint(a, loading, error) {
      box.replaceChildren(h("h3", { text: "15-minute dare" }));
      if (a) {
        box.append(h("div", { class: "task" },
          h("h4", { text: a.title }),
          a.materials.length ? h("ul", { class: "chips" }, a.materials.map(function (m) { return h("li", { text: m }); })) : null,
          h("ol", {}, a.steps.map(function (s) { return h("li", { text: s }); })),
          a.twist ? h("p", { class: "twist", text: a.twist }) : null));
      }
      if (!a) {
        var row = h("div", { class: "row" });
        var btn = h("button", { class: "btn", type: "button", text: loading ? "Cooking up a dare..." : "Dare me" });
        btn.disabled = !!loading;
        btn.addEventListener("click", async function () {
          paint(null, true);
          try {
            var next = await makeAssignment(entry, "");
            if (!opts.example) saveAssignment(entry, next); else entry.assignment = next;
            paint(next);
          } catch (e) { paint(null, false, errCopy(e)); }
        });
        row.append(btn);
        if (error) row.append(h("span", { class: "hint", text: error }));
        if (!loading && !error) row.append(h("span", { class: "hint", text: "One dare per pic. Make it count." }));
        box.append(row);
      } else if (!opts.example) {
        box.append(resultBox());
      }
    }
    paint(entry.assignment);
    return h("article", { class: "card lesson" }, shot, info, box);
  }
  function loadingView(img) {
    var msgs = ["Reading the brushstrokes...", "Hunting for a signature...", "Checking the colours...", "Asking art history for the gossip..."];
    var p = h("p", { text: msgs[0] }), i = 0;
    var t = setInterval(function () { i = (i + 1) % msgs.length; p.textContent = msgs[i]; if (!p.isConnected) clearInterval(t); }, 2200);
    return h("div", { class: "card status" },
      img ? h("figure", { class: "shot" }, h("img", { src: img, alt: "Your photo" })) : null,
      p, h("div", { class: "bar", "aria-hidden": "true" }));
  }
  function errorView(e) {
    var box = h("div", { class: "card err" }, h("p", { text: errCopy(e) }), e && e.detail ? h("p", { class: "hint", text: "Details: " + e.detail }) : null);
    if (e && e.code === "unauthorized") {
      var inp = h("input", { type: "password", id: "code", class: "codein", placeholder: "Access code", autocomplete: "off" });
      box.append(h("div", { class: "row" }, inp, h("button", { class: "btn", type: "button", text: "Unlock", onclick: function () {
        lsSet(CODE_KEY, inp.value.trim()); if (lastFile) analyse(lastFile);
      } })));
    } else if (lastFile) {
      box.append(h("button", { class: "btn", type: "button", text: "Try again", onclick: function () { analyse(lastFile); } }));
    }
    return box;
  }

  /* ---------- scan flow ---------- */
  function setBusy(b) {
    busy = b;
    ["#btn-cam", "#btn-up"].forEach(function (s) { $(s).classList.toggle("busy", b); $(s + " input").disabled = b; });
  }
  async function analyse(file) {
    if (busy || !file) return;
    var host = $("#lesson-host");
    lastFile = file;
    setBusy(true);
    try {
      var full, thumb;
      try { full = await scaled(file, 1280, 0.8); thumb = await scaled(file, 640, 0.78); }
      catch (e) { throw { code: "image_rejected" }; }
      host.replaceChildren(loadingView(thumb));
      var raw = await ai("/api/analyse", { image: full });
      var entry = saveEntry(normalise(raw, thumb));
      host.replaceChildren(lessonView(entry));
      renderArchive();
      toast("Saved to your stash.");
      host.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      host.replaceChildren(errorView(e));
    } finally { setBusy(false); }
  }
  var previewUrl = null;
  function preview(file) {
    if (busy || !file) return;
    if (!/^image\//.test(file.type || "image/")) { $("#lesson-host").replaceChildren(errorView({ code: "image_rejected" })); return; }
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(file);
    lastFile = file;
    var host = $("#lesson-host");
    var change = h("label", { class: "btn alt" }, "Change image",
      h("input", { class: "pick", type: "file", accept: "image/*", "aria-label": "Change image", onchange: function (ev) {
        var f = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (f) preview(f);
      } }));
    host.replaceChildren(h("div", { class: "card status" },
      h("figure", { class: "shot" }, h("img", { src: previewUrl, alt: "Your pic" })),
      h("p", { text: "Good pic?" }),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", text: "Use this", onclick: function () { analyse(file); } }),
        change)));
    host.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function wireInputs() {
    var drop = $("#drop");
    ["#in-cam", "#in-up"].forEach(function (s) {
      $(s).addEventListener("change", function (ev) {
        var f = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (f) preview(f);
      });
    });
    ["dragenter", "dragover"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && /^image\//.test(f.type)) preview(f);
    });
  }

  /* ---------- archive ---------- */
  function fmtDate(ts) { try { return new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); } catch (e) { return ""; } }
  function renderArchive() {
    var list = sorted();
    $("#tab-archive").textContent = "My stash (" + list.length + ")";
    var host = $("#archive-host");
    if (openId) {
      var entry = list.filter(function (d) { return d.id === openId; })[0];
      if (entry) { if (!host.querySelector("[data-open='" + openId + "']")) renderDetail(entry); return; }
      openId = null;
    }
    if (!list.length) {
      host.replaceChildren(h("div", { class: "card empty" },
        h("h2", { text: "Empty stash" }),
        h("p", { text: "Everything you decode lands here, with its lesson and its dare." }),
        h("button", { class: "btn", type: "button", text: "Decode your first one", onclick: function () { showTab("scan"); } })));
      return;
    }
    host.replaceChildren(h("div", { class: "grid" }, list.map(function (d) {
      return h("button", { class: "tile", type: "button", onclick: function () { openId = d.id; renderDetail(d); } },
        d.image ? h("img", { src: d.image, alt: "", loading: "lazy" }) : null,
        h("span", { class: "tb" },
          h("strong", { text: d.title }),
          h("small", { text: d.artist + " · " + fmtDate(d.createdAt) }),
          (d.resultImage || d.assignment) ? h("span", { class: "has", text: d.resultImage ? "Dare done" : "Dare unlocked" }) : null));
    })));
  }
  function renderDetail(entry) {
    var host = $("#archive-host");
    var armed = false, delBtn;
    delBtn = h("button", { class: "btn alt", type: "button", text: "Delete", onclick: function () {
      if (!armed) {
        armed = true; delBtn.textContent = "Really delete?";
        setTimeout(function () { armed = false; delBtn.textContent = "Delete"; }, 4000);
      } else deleteEntry(entry);
    } });
    host.replaceChildren(h("div", { "data-open": entry.id },
      h("div", { class: "bar-top" },
        h("button", { class: "btn alt", type: "button", text: "Back to stash", onclick: function () { openId = null; renderArchive(); } }),
        delBtn),
      lessonView(entry)));
    host.scrollIntoView({ block: "start" });
  }

  /* ---------- tabs + boot ---------- */
  function showTab(name) {
    var scan = name === "scan";
    $("#tab-scan").setAttribute("aria-selected", scan);
    $("#tab-archive").setAttribute("aria-selected", !scan);
    $("#view-scan").hidden = !scan; $("#view-archive").hidden = scan;
    if (!scan) { openId = null; renderArchive(); }
  }
  $("#tab-scan").addEventListener("click", function () { showTab("scan"); });
  $("#tab-archive").addEventListener("click", function () { showTab("archive"); });

  load();
  wireInputs();
  $("#lesson-host").replaceChildren(lessonView(JSON.parse(JSON.stringify(EXAMPLE)), { example: true }));
  renderArchive();
})();
</script>
</body>
</html>
